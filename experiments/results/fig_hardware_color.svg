<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
  <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f5c8b"/>
  </marker>
</defs>
<rect width="1280" height="470" fill="#ffffff"/>

<g stroke="#1a1a1a" stroke-width="1.5" fill="none">
  <rect x="40" y="110" width="165" height="310" fill="#f2f2f2"/>
  <rect x="235" y="110" width="810" height="310" fill="#ffffff"/>
  <rect x="1075" y="110" width="175" height="310" fill="#c3daee"/>

  <!-- write path; the accent begins where the data becomes codes -->
  <rect x="250" y="170" width="138" height="63" fill="#ffffff"/>
  <rect x="410" y="170" width="138" height="63" fill="#ffffff"/>
  <rect x="570" y="170" width="138" height="63" fill="#ffffff"/>
  <rect x="730" y="170" width="138" height="63" fill="#cfe2f3"/>
  <rect x="890" y="170" width="138" height="63" fill="#cfe2f3"/>

  <!-- lane array; kv_store_ddr sits outside it, because it is shared -->
  <rect x="240" y="292" width="638" height="88" fill="#fafafa"/>
  <rect x="250" y="304" width="138" height="63" fill="#ffffff"/>
  <rect x="410" y="304" width="138" height="63" fill="#ffffff"/>
  <rect x="570" y="304" width="138" height="63" fill="#ffffff"/>
  <rect x="730" y="304" width="138" height="63" fill="#cfe2f3"/>

  <rect x="890" y="294" width="138" height="84" fill="#cfe2f3"/>
  <rect x="897" y="338" width="30" height="28" fill="#aecde9"/>
  <rect x="933" y="338" width="30" height="28" fill="#aecde9"/>
  <rect x="987" y="338" width="34" height="28" fill="#aecde9"/>

  <!-- write arrows -->
  <path d="M208,201 L246,201" marker-end="url(#ar)"/>
  <path d="M390,201 L408,201" marker-end="url(#ar)"/>
  <path d="M550,201 L568,201" marker-end="url(#ar)"/>
  <path d="M710,201 L728,201" marker-end="url(#ar)"/>

  <!-- read arrows -->
  <path d="M728,336 L710,336" marker-end="url(#ar)"/>
  <path d="M568,336 L550,336" marker-end="url(#ar)"/>
  <path d="M408,336 L390,336" marker-end="url(#ar)"/>
  <path d="M246,336 L208,336" marker-end="url(#ar)"/>

  <!-- q branch -->
  <path d="M479,233 L479,264 L799,264 L799,300" marker-end="url(#ar)"/>

  <!-- rules inside host -->
  <g stroke="#9a9a9a" stroke-width="1">
    <path d="M56,154 L189,154"/>
    <path d="M56,258 L189,258"/>
    <path d="M56,332 L189,332"/>
  </g>
  <g stroke="#7ba4c6" stroke-width="1">
    <path d="M1090,170 L1235,170"/>
    <path d="M1090,220 L1235,220"/>
    <path d="M1090,312 L1235,312"/>
  </g>
</g>

<!-- the compressed row: written, stored, read back and scored, never decompressed -->
<g stroke="#1f5c8b" stroke-width="2.2" fill="none">
  <path d="M870,201 L888,201" marker-end="url(#arb)"/>
  <path d="M1032,201 L1071,201" marker-end="url(#arb)"/>
  <path d="M1071,336 L1032,336" marker-end="url(#arb)"/>
  <path d="M888,336 L870,336" stroke-width="3" marker-end="url(#arb)"/>
</g>

<g fill="#1a1a1a" text-anchor="middle">
  <text x="122" y="138" font-size="15">Host</text>

  <text x="1162" y="136" font-size="15">DDR</text>
  <text x="1162" y="156" font-size="12">KV cache</text>
  <text x="1162" y="190" font-size="9.5" fill="#1a3d57">one 52-byte row per</text>
  <text x="1162" y="204" font-size="9.5" fill="#1a3d57">token, per KV head</text>
  <text x="1162" y="240" font-size="9.5" fill="#1a3d57">the row is cut into P</text>
  <text x="1162" y="254" font-size="9.5" fill="#1a3d57">slices, and each one is</text>
  <text x="1162" y="268" font-size="9.5" fill="#1a3d57">kept as its own array,</text>
  <text x="1162" y="282" font-size="9.5" fill="#1a3d57">contiguous and running</text>
  <text x="1162" y="296" font-size="9.5" fill="#1a3d57">across all the tokens</text>
  <text x="1162" y="332" font-size="9.5" fill="#1a3d57">each AXI port reads</text>
  <text x="1162" y="346" font-size="9.5" fill="#1a3d57">one slice and nothing</text>
  <text x="1162" y="360" font-size="9.5" fill="#1a3d57">else, which turns the</text>
  <text x="1162" y="374" font-size="9.5" fill="#1a3d57">whole scan into long</text>
  <text x="1162" y="388" font-size="9.5" fill="#1a3d57">sequential bursts</text>

  <!-- write path -->
  <text x="319" y="206" font-size="13.5">attn_ingress</text>
  <text x="479" y="197" font-size="13.5">rot_fwht</text>
  <text x="479" y="216" font-size="9.5" fill="#555555">k, v, q</text>
  <text x="639" y="206" font-size="13.5">rot_norm</text>
  <text x="799" y="206" font-size="13.5">rot_encode</text>
  <text x="959" y="193" font-size="13.5">kv_write</text>
  <text x="959" y="210" font-size="9" fill="#33566f">one row per token,</text>
  <text x="959" y="222" font-size="9" fill="#33566f">per KV head</text>

  <!-- lanes -->
  <text x="319" y="340" font-size="13.5">finalize</text>
  <text x="479" y="340" font-size="13.5">accum</text>
  <text x="639" y="340" font-size="13.5">softmax_online</text>
  <text x="799" y="340" font-size="13.5">score_lane</text>

  <!-- shared read engine -->
  <text x="959" y="317" font-size="13.5">kv_store_ddr</text>
  <text x="912" y="357" font-size="9">0</text>
  <text x="948" y="357" font-size="9">1</text>
  <text x="975" y="358" font-size="11" fill="#33566f">…</text>
  <text x="1004" y="357" font-size="9">P−1</text>

  <text x="639" y="257" font-size="9.5" fill="#333333">q is held inside each lane and never written to the cache</text>

  <text x="959" y="391" font-size="9" fill="#33566f">the P ports fetch one</text>
  <text x="959" y="403" font-size="9" fill="#33566f">whole row per cycle, and</text>
  <text x="959" y="415" font-size="9" fill="#33566f">all G lanes score on it</text>
</g>

<g fill="#1a1a1a" text-anchor="start">
  <text x="250" y="133" font-size="12.5">Programmable logic</text>
  <text x="250" y="150" font-size="10" fill="#555555">one KV head at a time — the H heads of a token run one after the other</text>
  <text x="240" y="286" font-size="10.5">× G  — one lane per query head of this KV head</text>

  <text x="56" y="176" font-size="10">sent to the block</text>
  <text x="64" y="195" font-size="9.5" fill="#555555">q, k and v for every</text>
  <text x="64" y="210" font-size="9.5" fill="#555555">head, already projected</text>
  <text x="64" y="225" font-size="9.5" fill="#555555">through W_q, W_k, W_v</text>
  <text x="64" y="240" font-size="9.5" fill="#555555">and carrying RoPE</text>

  <text x="56" y="280" font-size="10">back from the block</text>
  <text x="64" y="299" font-size="9.5" fill="#555555">the attention output</text>
  <text x="64" y="314" font-size="9.5" fill="#555555">for all of the heads</text>

  <text x="56" y="354" font-size="10">finished on the host</text>
  <text x="64" y="373" font-size="9.5" fill="#555555">W_o′  (R⁻¹ folded in)</text>
  <text x="64" y="388" font-size="9.5" fill="#555555">MLP  →  logits</text>
  <text x="64" y="403" font-size="9.5" fill="#555555">then the next layer</text>
</g>

<g text-anchor="start">
  <rect x="40" y="432" width="20" height="10" fill="#cfe2f3" stroke="#1a1a1a" stroke-width="1"/>
  <text x="68" y="441" font-size="9.5" fill="#1f5c8b">shaded, and the heavy arrows: the compressed row — written, stored, streamed back and scored without ever being decompressed</text>
  <text x="40" y="458" font-size="9.5" fill="#666666">The ZCU104 provides four AXI-HP ports, each carrying 128 bits — 16 bytes — per cycle, so a cache row can be at most 64 bytes wide</text>
</g>
</svg>
