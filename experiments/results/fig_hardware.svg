    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
</defs>
<rect width="1280" height="565" fill="#ffffff"/>

<!-- ============================ PANEL (a) ============================ -->
<g stroke="#1a1a1a" stroke-width="1.5" fill="none">
  <rect x="760" y="30" width="480" height="76" fill="#d8d8d8"/>
  <rect x="40" y="150" width="155" height="250" fill="#f2f2f2"/>
  <rect x="228" y="150" width="1012" height="250" fill="#ffffff"/>

  <!-- row 1 -->
  <rect x="250" y="188" width="115" height="60" fill="#ffffff"/>
  <rect x="390" y="188" width="115" height="60" fill="#ffffff"/>
  <rect x="530" y="188" width="245" height="60" fill="#e8e8e8"/>
  <path d="M630,188 L630,248"/>
  <rect x="800" y="188" width="115" height="60" fill="#e8e8e8"/>
  <rect x="975" y="180" width="240" height="78" fill="#ffffff"/>
  <rect x="985" y="224" width="50" height="22" fill="#f0f0f0"/>
  <rect x="1041" y="224" width="50" height="22" fill="#f0f0f0"/>
  <rect x="1097" y="224" width="50" height="22" fill="#f0f0f0"/>
  <rect x="1153" y="224" width="50" height="22" fill="#f0f0f0"/>

  <!-- lane array, x G -->
  <rect x="258" y="298" width="670" height="85" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
  <rect x="254" y="294" width="670" height="85" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
  <rect x="250" y="290" width="670" height="85" fill="#fafafa"/>
  <rect x="268" y="308" width="150" height="54" fill="#e8e8e8"/>
  <rect x="438" y="308" width="170" height="54" fill="#ffffff"/>
  <rect x="628" y="308" width="105" height="54" fill="#ffffff"/>
  <rect x="753" y="308" width="120" height="54" fill="#ffffff"/>

  <!-- arrows -->
  <path d="M195,218 L244,218" marker-end="url(#ar)"/>
  <path d="M365,218 L384,218" marker-end="url(#ar)"/>
  <path d="M505,218 L524,218" marker-end="url(#ar)"/>
  <path d="M775,218 L794,218" marker-end="url(#ar)"/>
  <path d="M857,188 L857,112" marker-end="url(#ar)"/>
  <path d="M1095,106 L1095,176" marker-end="url(#ar)"/>
  <path d="M418,335 L432,335" marker-end="url(#ar)"/>
  <path d="M608,335 L622,335" marker-end="url(#ar)"/>
  <path d="M733,335 L747,335" marker-end="url(#ar)"/>
  <path d="M447,248 L447,272 L343,272 L343,302" marker-end="url(#ar)"/>
  <path d="M873,335 L945,335 L945,144" marker-end="url(#ar)"/>
  <path d="M1095,258 L1095,392 L300,392 L300,379" stroke-width="2.6" marker-end="url(#ar)"/>

  <!-- seam -->
  <path d="M212,152 L212,398" stroke-dasharray="6 4" stroke-width="1.2"/>
</g>

<g fill="#1a1a1a" text-anchor="middle">
  <text x="1000" y="58" font-size="17">DDR — the KV cache</text>
  <text x="1000" y="80" font-size="10.5" fill="#444444">stored transposed: plane p holds row bytes [ ΣW, +W_p ) for every token</text>

  <text x="117" y="180" font-size="15">Host</text>
  <text x="117" y="203" font-size="10" fill="#555555">W_q  W_k  W_v</text>
  <text x="117" y="219" font-size="10" fill="#555555">RoPE</text>
  <text x="117" y="243" font-size="10" fill="#555555">W_o′  (R⁻¹ folded in)</text>
  <text x="117" y="267" font-size="10" fill="#555555">MLP, logits</text>
  <text x="117" y="300" font-size="9.5" fill="#777777">all O(1) in context</text>

  <text x="307" y="212" font-size="14">attn_ingress</text>
  <text x="307" y="231" font-size="9.5" fill="#555555">(2+G) vec / group</text>
  <text x="447" y="212" font-size="14">rot_fwht</text>
  <text x="447" y="231" font-size="9.5" fill="#555555">Walsh–Hadamard</text>
  <text x="580" y="212" font-size="13">rot_norm</text>
  <text x="580" y="231" font-size="9.5" fill="#555555">→ w_n</text>
  <text x="702" y="212" font-size="13">rot_encode ×2</text>
  <text x="702" y="231" font-size="9.5" fill="#555555">2^b_k / 2^b_v</text>
  <text x="857" y="212" font-size="14">kv_write</text>
  <text x="857" y="231" font-size="9.5" fill="#555555">1 row / token</text>

  <text x="1095" y="200" font-size="14">kv_store_ddr</text>
  <text x="1095" y="217" font-size="9.5" fill="#555555">P × AXI-HP read, burst 64</text>
  <text x="1010" y="239" font-size="9.5">0</text>
  <text x="1066" y="239" font-size="9.5">1</text>
  <text x="1122" y="239" font-size="9.5">2</text>
  <text x="1178" y="239" font-size="9.5">P−1</text>

  <text x="343" y="331" font-size="13">score_lane</text>
  <text x="343" y="349" font-size="9.5" fill="#555555">⟨rq, codes⟩ → w_s</text>
  <text x="523" y="331" font-size="13">softmax_online</text>
  <text x="523" y="349" font-size="9.5" fill="#555555">+ exp_lut</text>
  <text x="680" y="331" font-size="13">accum</text>
  <text x="680" y="349" font-size="9.5" fill="#555555">w_a</text>
  <text x="813" y="331" font-size="13">finalize</text>
  <text x="813" y="349" font-size="9.5" fill="#555555">÷ l → w_o</text>

  <text x="690" y="387" font-size="10">shared row — one per cycle, broadcast to all G lanes</text>
</g>

<g fill="#1a1a1a" text-anchor="start">
  <text x="40" y="144" font-size="14">(a)</text>
  <text x="238" y="169" font-size="12.5">Attention block  (programmable logic)</text>
  <text x="250" y="284" font-size="11">lane array  × G</text>
  <text x="455" y="268" font-size="9.5">q_0 … q_(G−1), held — never cached</text>
  <text x="955" y="152" font-size="9.5">→ host</text>
  <text x="216" y="146" font-size="9.5" fill="#555555">seam: w_L</text>
</g>

<!-- ============================ PANEL (b) ============================ -->
<g stroke="#1a1a1a" stroke-width="1.3" fill="none">
  <rect x="140" y="462" width="430" height="24" fill="#f0f0f0"/>
  <path d="M355,462 L355,486" stroke-width="1"/>
  <rect x="140" y="500" width="87" height="24" fill="#b8b8b8"/>

  <rect x="760" y="462" width="271" height="24" fill="#b8b8b8"/>
  <rect x="1031" y="462" width="135" height="24" fill="#d8d8d8"/>
  <rect x="1166" y="462" width="34" height="24" fill="#8a8a8a"/>

  <rect x="760" y="500" width="135" height="22" fill="#ffffff"/>
  <rect x="895" y="500" width="135" height="22" fill="#f0f0f0"/>
  <rect x="1030" y="500" width="135" height="22" fill="#ffffff"/>
  <rect x="1165" y="500" width="35" height="22" fill="#f0f0f0"/>
  <path d="M895,458 L895,526" stroke-dasharray="4 3" stroke-width="1.4" stroke="#1a1a1a"/>
</g>

<g fill="#1a1a1a">
  <text x="40" y="448" font-size="14">(b)</text>
  <text x="70" y="448" font-size="11.5">cache row per token per KV head — drawn to scale</text>
  <text x="40" y="479" font-size="10" text-anchor="start">fp16</text>
  <text x="40" y="517" font-size="10" text-anchor="start">codes</text>
  <text x="247" y="511" font-size="10.5" text-anchor="start">R = d(b_k+b_v) + 2w_n = 52 B</text>
  <text x="247" y="524" font-size="10.5" text-anchor="start" fill="#444444">4.92× smaller</text>
  <text x="580" y="479" font-size="10" text-anchor="start">2·d·16 = 256 B</text>
  <text x="247" y="479" font-size="9.5" text-anchor="start" fill="#777777">d keys  |  d values</text>

  <text x="760" y="448" font-size="11.5" text-anchor="start">fields (above) vs P planes (below), magnified</text>
  <text x="895" y="477" font-size="9.5" text-anchor="middle" fill="#ffffff">d · b_k</text>
  <text x="1098" y="477" font-size="9.5" text-anchor="middle">d · b_v</text>
  <text x="1183" y="477" font-size="8.5" text-anchor="middle" fill="#ffffff">2w_n</text>
  <text x="827" y="515" font-size="9.5" text-anchor="middle">plane 0</text>
  <text x="962" y="515" font-size="9.5" text-anchor="middle">1</text>
  <text x="1097" y="515" font-size="9.5" text-anchor="middle">2</text>
  <text x="1182" y="515" font-size="9.5" text-anchor="middle">3</text>
  <text x="760" y="542" font-size="9.5" text-anchor="start" fill="#444444">planes are byte-ranges sized to saturate one w_axi port each — they do not align with the fields:  P = ⌈ R / (w_axi/8) ⌉</text>

  <text x="40" y="560" font-size="9.5" fill="#666666">Symbols are parameters. As evaluated: d=64, b_k=4, b_v=2, w_n=16, w_L=24, w_axi=128, H=8 KV heads, G=4 queries/head, P=4 (16,16,16,4 B); H groups run sequentially.</text>
</g>
</svg>
