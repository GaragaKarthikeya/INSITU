<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 455" width="1280" height="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
  </marker>
  <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
  </marker>
</defs>
<rect width="1280" height="455" fill="#ffffff"/>

<!-- regions: where a block sits is what it is -->
<g stroke-width="1.6" fill="none">
  <rect x="40"   y="110" width="165" height="310" fill="#EDE4F3" stroke="#7B5EA7"/>
  <rect x="235"  y="110" width="810" height="310" fill="#E6F0E2" stroke="#4C8C3F"/>
  <rect x="1075" y="110" width="190" height="310" fill="#D9E7F5" stroke="#0072B2"/>
  <rect x="240"  y="292" width="632" height="88"  fill="#D4E7CE" stroke="#4C8C3F"/>
</g>

<!-- blocks stay white, bordered in their region's colour -->
<g stroke-width="1.4" fill="#ffffff">
  <g stroke="#4C8C3F">
    <rect x="250" y="170" width="138" height="63"/>
    <rect x="410" y="170" width="138" height="63"/>
    <rect x="570" y="170" width="138" height="63"/>
    <rect x="730" y="170" width="138" height="63"/>
    <rect x="890" y="170" width="138" height="63"/>
    <rect x="250" y="304" width="138" height="63"/>
    <rect x="410" y="304" width="138" height="63"/>
    <rect x="570" y="304" width="138" height="63"/>
    <rect x="730" y="304" width="138" height="63"/>
  </g>
  <g stroke="#0072B2">
    <rect x="890" y="294" width="138" height="84"/>
    <rect x="897" y="338" width="30" height="28" fill="#AECDE9"/>
    <rect x="933" y="338" width="30" height="28" fill="#AECDE9"/>
    <rect x="987" y="338" width="34" height="28" fill="#AECDE9"/>
  </g>
</g>

<!-- the token on its way into the cache -->
<g stroke="#D55E00" stroke-width="1.6" fill="none">
  <path d="M208,201 L246,201"   marker-end="url(#aw)"/>
  <path d="M390,201 L408,201"   marker-end="url(#aw)"/>
  <path d="M550,201 L568,201"   marker-end="url(#aw)"/>
  <path d="M710,201 L728,201"   marker-end="url(#aw)"/>
  <path d="M870,201 L888,201"   marker-end="url(#aw)"/>
  <path d="M1032,201 L1071,201" marker-end="url(#aw)"/>
  <path d="M479,233 L479,264 L799,264 L799,303" marker-end="url(#aw)"/>
</g>

<!-- the scan on its way back out -->
<g stroke="#0072B2" stroke-width="1.6" fill="none">
  <path d="M1071,336 L1032,336" marker-end="url(#ard)"/>
  <path d="M888,336 L869,336"   marker-end="url(#ard)"/>
  <path d="M728,336 L710,336"   marker-end="url(#ard)"/>
  <path d="M568,336 L550,336"   marker-end="url(#ard)"/>
  <path d="M408,336 L390,336"   marker-end="url(#ard)"/>
  <path d="M246,336 L208,336"   marker-end="url(#ard)"/>
</g>

<g fill="none" stroke-width="1">
  <g stroke="#B49CC9">
    <path d="M56,154 L189,154"/>
    <path d="M56,258 L189,258"/>
    <path d="M56,332 L189,332"/>
  </g>
  <g stroke="#7BA4C6">
    <path d="M1090,170 L1250,170"/>
    <path d="M1090,220 L1250,220"/>
    <path d="M1090,312 L1250,312"/>
  </g>
</g>

<g fill="#1a1a1a" text-anchor="middle">
  <text x="122" y="138" font-size="15" fill="#5B3F85">Host</text>

  <text x="1170" y="136" font-size="15" fill="#0072B2">DDR</text>
  <text x="1170" y="156" font-size="12" fill="#0072B2">KV cache</text>
  <text x="1170" y="190" font-size="9.5" fill="#14506F">one 52-byte row</text>
  <text x="1170" y="204" font-size="9.5" fill="#14506F">per KV head</text>
  <text x="1170" y="240" font-size="9.5" fill="#14506F">the row is cut into</text>
  <text x="1170" y="254" font-size="9.5" fill="#14506F">P slices, each kept</text>
  <text x="1170" y="268" font-size="9.5" fill="#14506F">as its own array</text>
  <text x="1170" y="282" font-size="9.5" fill="#14506F">across all tokens</text>
  <text x="1170" y="332" font-size="9.5" fill="#14506F">each AXI port reads</text>
  <text x="1170" y="346" font-size="9.5" fill="#14506F">one slice only, so</text>
  <text x="1170" y="360" font-size="9.5" fill="#14506F">the whole scan is</text>
  <text x="1170" y="374" font-size="9.5" fill="#14506F">long sequential bursts</text>

  <text x="319" y="206" font-size="13.5">attn_ingress</text>
  <text x="479" y="197" font-size="13.5">rot_fwht</text>
  <text x="479" y="216" font-size="9.5" fill="#555555">k, v, q</text>
  <text x="639" y="206" font-size="13.5">rot_norm</text>
  <text x="799" y="206" font-size="13.5">rot_encode</text>
  <text x="959" y="193" font-size="13.5">kv_write</text>
  <text x="959" y="210" font-size="9" fill="#555555">one row per token</text>
  <text x="959" y="222" font-size="9" fill="#555555">per KV head</text>

  <text x="319" y="340" font-size="13.5">finalize</text>
  <text x="479" y="340" font-size="13.5">accum</text>
  <text x="639" y="340" font-size="13.5">softmax_online</text>
  <text x="799" y="340" font-size="13.5">score_lane</text>

  <text x="959" y="317" font-size="13.5" fill="#14506F">kv_store_ddr</text>
  <text x="912" y="357" font-size="9" fill="#14506F">0</text>
  <text x="948" y="357" font-size="9" fill="#14506F">1</text>
  <text x="975" y="358" font-size="11" fill="#14506F">…</text>
  <text x="1004" y="357" font-size="9" fill="#14506F">P−1</text>
  <text x="959" y="391" font-size="9" fill="#14506F">P ports fetch one</text>
  <text x="959" y="403" font-size="9" fill="#14506F">row per cycle, all</text>
  <text x="959" y="415" font-size="9" fill="#14506F">G lanes read it</text>

  <text x="639" y="257" font-size="9.5" fill="#A24A00">q is held inside each lane and never written to the cache</text>
</g>

<g fill="#1a1a1a" text-anchor="start">
  <text x="250" y="133" font-size="12.5" fill="#35682C">Programmable logic</text>
  <text x="250" y="150" font-size="10" fill="#4C8C3F">one KV head at a time — the H heads of a token run one after the other</text>
  <text x="240" y="286" font-size="10.5" fill="#35682C">× G  — one lane per query head of this KV head</text>

  <text x="56" y="176" font-size="10" fill="#5B3F85">to the block</text>
  <text x="64" y="196" font-size="9.5" fill="#4A3663">W_q , W_k , W_v</text>
  <text x="64" y="212" font-size="9.5" fill="#4A3663">RoPE</text>

  <text x="56" y="280" font-size="10" fill="#5B3F85">back from it</text>
  <text x="64" y="300" font-size="9.5" fill="#4A3663">attention output</text>

  <text x="56" y="354" font-size="10" fill="#5B3F85">on the host</text>
  <text x="64" y="374" font-size="9.5" fill="#4A3663">W_o′ , MLP</text>
  <text x="64" y="390" font-size="9.5" fill="#4A3663">logits, next layer</text>
</g>

<g text-anchor="start" font-size="9.5">
  <rect x="40" y="430" width="22" height="3" fill="#D55E00"/>
  <text x="70" y="437" fill="#A24A00">the token on its way into the cache</text>
  <rect x="400" y="430" width="22" height="3" fill="#0072B2"/>
  <text x="430" y="437" fill="#14506F">the scan on its way back out</text>
</g>
</svg>
